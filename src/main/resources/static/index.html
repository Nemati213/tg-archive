<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .date-divider-sticky { opacity: 0; will-change: opacity; }
        .scrolling .date-divider-sticky { opacity: 1; }

        @keyframes highlight {
        0% { background-color: rgba(59, 130, 246, 0.3); transform: scale(1.02); }
        100% { background-color: transparent; transform: scale(1); }
    }
    .highlight-animation .message-bubble {
        animation: highlight 2s ease-out;
    }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

<header class="bg-white shadow p-4 flex flex-wrap gap-4 items-end z-10">
    <div class="flex flex-col">
        <label class="text-xs text-gray-500">Поиск</label>
        <input type="text" id="searchInput" placeholder="Текст..." class="border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div class="flex flex-col">
        <label class="text-xs text-gray-500">Автор</label>
        <input type="text" id="authorInput" placeholder="Имя..." class="border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-blue-400">
    </div>
    <div class="flex flex-col">
        <label class="text-xs text-gray-500">Тип медиа</label>
        <select id="mediaTypeInput" class="border rounded p-2 text-sm outline-none focus:ring-2 focus:ring-blue-400 bg-white">
            <option value="ALL">Все</option>
            <option value="PHOTO">Фото</option>
            <option value="VIDEO">Видео</option>
            <option value="VIDEO_NOTE">Кружочки</option>
            <option value="VOICE">Голосовые</option>
            <option value="FILE">Файлы</option>
        </select>
    </div>
    <div class="flex flex-col">
        <label class="text-xs text-gray-500">От (дата)</label>
        <input type="datetime-local" id="dateFrom" class="border rounded p-2 text-sm outline-none">
    </div>
    <div class="flex flex-col">
        <label class="text-xs text-gray-500">До (дата)</label>
        <input type="datetime-local" id="dateTo" class="border rounded p-2 text-sm outline-none">
    </div>
    <button id="searchBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded text-sm transition-colors">
        Найти
    </button>

    <div class="h-8 w-[1px] bg-gray-300 hidden md:block"></div>

    <div class="flex flex-col">
        <label class="text-xs text-blue-600 font-semibold">Перейти к дате</label>
        <input type="date" id="calendarJumpInput" class="border border-blue-300 rounded p-2 text-sm outline-none focus:ring-2 focus:ring-blue-400 bg-blue-50">
    </div>
</header>

<main id="chat-box" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
    <div class="text-center my-2">
        <button id="loadPrevBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded text-sm hidden transition-colors">
            Загрузить предыдущие
        </button>
    </div>

</main>

<footer class="bg-white shadow p-4 text-center">
    <button id="loadMoreBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded text-sm hidden transition-colors">
        Загрузить еще
    </button>
</footer>

<div id="lightbox" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center cursor-pointer">
    <img id="lightbox-img" class="max-w-full max-h-full p-4 object-contain" src="" alt="Full size">
</div>

<template id="message-template">
    <!-- Строка сообщения (контейнер) -->
    <div class="message-row flex items-end gap-2 max-w-2xl my-1">

        <!-- Аватарка -->
        <div class="msg-avatar w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0 self-start mt-1 select-none">
        </div>

        <!-- Сам баббл сообщения (добавили relative и group) -->
        <div class="message-bubble bg-white p-3 rounded-2xl shadow-sm flex flex-col relative group">

            <!-- Хедер баббла (Автор и Дата) -->
            <div class="msg-header flex justify-between items-baseline gap-4 mb-1">
                <span class="msg-author text-xs font-bold text-blue-600">Автор</span>
                <span class="msg-date text-[10px] text-gray-400">Дата</span>
            </div>

            <!-- Переслано от -->
            <div class="msg-forwarded hidden text-[11px] text-gray-500 italic mb-1">
                Переслано от: <span class="forwarded-name font-semibold">Имя</span>
            </div>

            <!-- Блок цитаты (Реплай) -->
            <div class="msg-reply hidden border-l-4 border-blue-400 bg-blue-50 p-2 mb-2 rounded text-xs">
                <span class="reply-author font-bold text-blue-700 block">Кого цитируем</span>
                <span class="reply-text text-gray-600 truncate block">Текст цитаты...</span>
            </div>

            <!-- Блок для медиа-файлов -->
            <div class="msg-media flex flex-wrap gap-2 mb-2 empty:hidden"></div>

            <!-- Текст сообщения -->
            <div class="msg-text text-sm text-gray-800 whitespace-pre-wrap">Текст сообщения</div>

            <!-- КОНТЕЙНЕР ДЛЯ ЗАМЕТОК (СТРОГО ПУСТОЙ, БЕЗ КОММЕНТАРИЕВ И ПРОБЕЛОВ) -->
            <div class="msg-notes-container mt-2 flex flex-col gap-1 empty:hidden border-t border-dashed border-gray-300 pt-2"></div>

            <!-- КНОПКА ДОБАВИТЬ ЗАМЕТКУ (ВНУТРИ БАББЛА СПРАВА ВВЕРХУ) -->
            <button class="add-note-btn opacity-0 group-hover:opacity-100 transition-opacity absolute right-2 top-2 text-gray-400 hover:text-orange-500 z-10" title="Добавить заметку">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
            </button>
        </div>

    </div>
</template>

<script type="module" src="/js/app.js"></script>

<div id="note-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-white p-5 rounded-xl shadow-2xl w-full max-w-md">
        <h3 class="text-lg font-bold text-gray-800 mb-3">Добавить заметку</h3>
        <textarea id="note-textarea" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-orange-400 outline-none resize-none h-24" placeholder="Напиши что-нибудь важное..."></textarea>
        <div class="flex justify-end gap-2 mt-4">
            <button id="note-cancel-btn" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">Отмена</button>
            <button id="note-save-btn" class="px-4 py-2 text-sm text-white bg-orange-500 hover:bg-orange-600 rounded-lg shadow transition-colors font-bold">Сохранить</button>
        </div>
    </div>
</div>
</body>
</html>
